name: Terraform CI/CD Pipeline to deploy EC2 infrastructure 

on:
  
  push:    
    branches:
      - main
    paths-ignore:
    - 'README.md'
    - '.md'
  pull_request:
    branches:
      - main  
    paths-ignore:
    - 'README.md'
    - '.md'    
    

env:
  TF_LOG: INFO
  TF_LOG_PATH: terraform.log
  TF_VERSION: 1.13.3 
  AWS_REGION: us-east-1
  WORKING_DIR: environments/prod

 
permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:

#####################################
  #  Format/lint & Validation
#####################################
  formatting-validate-linting:
    runs-on: ubuntu-latest
    name: 'Formatting, Linting, and Validation' 
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v2      

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init 

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
     
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color        
     
      # - name: Terraform lint
      #   id: tflint
      #   uses: terraform-linters/setup-tflint@v6
      #   with:
      #     version: latest
      #     cache: true

      - name: Generate Terraform Plan
        id: plan
        # run: terraform plan -out=tfplan -no-color -input=false -lock-timeout=300s
        run: |
            terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        working-directory: environments/prod
        continue-on-error: true

      - name: Format Plan Output
        id: format_plan
        run: |
           # Truncate if too long (GitHub issue body limit is 65536 chars)
           PLAN=$(cat plan_output.txt | head -c 50000)
           # Save as multiline env var
            echo "PLAN<<EOF" >> $GITHUB_ENV
            echo "$PLAN" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
    
    
  
#####################################
  #  Plan Review and manual approval
#####################################
  plan-manual-approval:
    runs-on: ubuntu-latest
    needs: formatting-validate-linting
    name: 'Manual Approval'    
    if: success()

    permissions:
      issues: write
    steps:
    
    - name: Await Manual Approval
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.TOKEN }}
        approvers: kodcapsule
        minimum-approvals: 1
        issue-title: "Deploying v1.3. to prod from staging"
        issue-body: |
            Please approve or deny the deployment of version v1.3.5.

            ## Terraform Plan Output
            <details>
            <summary>Click here to expand</summary>
            ${{ env.GITHUB_ENV }}
            **To approve:** comment `approved`
            **To deny:** comment `denied`
            </details>
# #####################################

  deploy-infrastructure:
    runs-on: ubuntu-latest
    name: 'Terraform Apply'
    needs: plan-manual-approval       
    steps:      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}   
    
      - name: Terraform Init
        id: init
        run: terraform init   

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve 
      
      