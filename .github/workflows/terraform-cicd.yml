name: Terraform CI/CD Pipeline to deploy EC2 infrastructure 

on:
  
  push:    
    branches:
      - main
  pull_request:
    branches:
      - main      
    

env:
  TF_LOG: INFO
  TF_LOG_PATH: terraform.log
  TF_VERSION: 1.13.3 
#   TF_WORKING_DIR: ./infra
  AWS_REGION: us-east-1

 
permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:

#####################################
  #  Format/lint & Validation
#####################################
  formatting-validate-linting:
    runs-on: ubuntu-latest
    name: 'Formatting, Linting, and Validation'
    # defaults:
    #   run:
    #     working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v2      

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init 

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
     
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color        
     
      - name: Terraform lint
        id: tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          version: latest
          cache: true

      - name: Generate Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color -input=false -lock-timeout=300s
        # working-directory: ${{ env.TF_WORKING_DIR }}
    
    
  
#####################################
  #  Plan Review and manual approval
#####################################
  plan-manual-approval:
    runs-on: ubuntu-latest
    needs: formatting-validate-linting
    name: 'Manual Approval'    
    if: success()

    permissions:
      issues: write
    steps:
    
    - name: Await Manual Approval
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.TOKEN }}
        approvers: kodcapsule
        minimum-approvals: 1
        issue-title: "Deploying v1.3.5 to prod from staging"
        issue-body: "Please approve or deny the deployment of version v1.3.5."
        exclude-workflow-initiator-as-approver: false
        
        
  

# #####################################
#   # Deployment infrastructure
# #####################################

  deploy-infrastructure:
    runs-on: ubuntu-latest
    name: 'Terraform Apply'
    needs: plan-manual-approval    
    # defaults:
    #   run:
    #     working-directory: ${{ env.TF_WORKING_DIR }}
    steps:      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}   
    
      - name: Terraform Init
        id: init
        run: terraform init   

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve 
        # working-directory: ${{ env.TF_WORKING_DIR }}
      